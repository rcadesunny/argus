spring:
  application:
    name: argus-server
  datasource:
    url: ${ARGUS_DB_URL}
    username: ${ARGUS_DB_USER}
    password: ${ARGUS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

argus:
  token:
    issuer: argus
    audience: argus
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    private-key-pem: ${ARGUS_JWT_PRIVATE_KEY:}